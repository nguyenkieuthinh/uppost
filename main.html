<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #1e1e2f 0%, #2d2d44 100%);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 1rem;
    }

    .hello-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 3.5rem;
      padding: 2.5rem 4rem;
      box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.6),
                  inset 0 1px 2px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }

    .hello-card:hover {
      transform: scale(1.02);
      box-shadow: 0 35px 55px -15px #000000cc,
                  inset 0 1px 3px rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.2);
    }

    h1 {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 650;
      letter-spacing: -0.02em;
      color: #f0eaff;
      text-shadow: 0 0 20px #a78bfa80, 0 0 40px #7c3aed40;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      line-height: 1.2;
      animation: gentleGlow 3s infinite alternate;
    }

    /* subtle animated glow on the greeting */
    @keyframes gentleGlow {
      0% {
        text-shadow: 0 0 15px #c4b5fd80, 0 0 30px #8b5cf650;
      }
      100% {
        text-shadow: 0 0 25px #d8ccff, 0 0 55px #a78bfa90;
      }
    }

    .wave {
      display: inline-block;
      animation: waveHand 2.2s infinite ease-in-out;
      transform-origin: 70% 70%;
      font-size: 1.1em;
    }

    @keyframes waveHand {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(18deg); }
      40% { transform: rotate(-8deg); }
      60% { transform: rotate(12deg); }
      80% { transform: rotate(-4deg); }
    }

    /* optional small credit – just for warmth, no link */
    .sub {
      text-align: center;
      margin-top: 0.8rem;
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #9ca3af;
      font-weight: 300;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="hello-card">
    <h1>
      <span>Hello</span>
      <span class="wave">🌍</span>
      <span>World</span>
    </h1>
    <div class="sub">✦ html ✦</div>
  </div>
</body>
</html>
