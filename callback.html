<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UpPost – login result</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --ink: #1b1b1f;
    --muted: #5b5b66; --line: #dcdad4; --accent: #fe2c55;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --surface: #1e1e22; --ink: #f2f1ee; --muted: #a4a4ae; --line: #34343a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 20px;
    background: var(--bg); color: var(--ink);
    font: 17px/1.6 Georgia, "Times New Roman", serif;
  }
  main { max-width: 620px; margin: 0 auto; padding: 72px 0 40px; }
  h1 { font-size: 1.8rem; margin: 0 0 12px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .box {
    margin: 18px 0;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    font: 0.9rem ui-monospace, Menlo, Consolas, monospace;
    word-break: break-all;
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 12px 22px; font: 600 1rem system-ui, sans-serif; cursor: pointer;
  }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1 id="title">Checking login…</h1>
  <p id="msg" class="muted"></p>
  <div id="result" hidden>
    <div class="box" id="code"></div>
    <button type="button" id="copy">Copy code</button>
    <p class="muted" style="margin-top:18px">
      Paste this code into the UpPost upload script on your computer. The code works once and expires quickly.
    </p>
  </div>
  <p><a href="index.html">Back to UpPost</a></p>
</main>

<script>
  var params = new URLSearchParams(window.location.search);
  var code = params.get("code");
  var state = params.get("state");
  var error = params.get("error");
  var title = document.getElementById("title");
  var msg = document.getElementById("msg");

  var saved = null;
  try { saved = sessionStorage.getItem("uppost_state"); } catch (e) {}

  if (error) {
    title.textContent = "Login was not completed";
    msg.textContent = "TikTok returned: " + error + ". Go back and select Login with TikTok to try again.";
  } else if (!code) {
    title.textContent = "No login code found";
    msg.textContent = "Open this page by logging in from the UpPost home page.";
  } else if (saved && state !== saved) {
    title.textContent = "Login could not be verified";
    msg.textContent = "The state value does not match. Go back and start the login again.";
  } else {
    title.textContent = "Login successful";
    msg.textContent = "Your authorization code is below.";
    document.getElementById("code").textContent = code;
    document.getElementById("result").hidden = false;
    document.getElementById("copy").addEventListener("click", function () {
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById("copy").textContent = "Copied";
      });
    });
  }
</script>
</body>
</html>
